      <path d="M0 0 L10 5 L0 10 z" fill="#E11D48"/>
    </marker>
    <marker id="lag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="960" height="470" rx="18" fill="#FFFFFF"/>
  <rect x="1" y="1" width="958" height="468" rx="17" stroke="#E2E8F0"/>

  <text x="44" y="48" fill="#94A3B8" font-size="11" letter-spacing="3">DECIDE</text>
  <text x="104" y="218" fill="#94A3B8" font-size="11" letter-spacing="3">BUILD</text>

  <!-- ── lane 1: decide ─────────────────────────────────────────── -->
  <rect x="44" y="70" width="104" height="64" rx="11" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="96" y="97" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Task</text>
  <text x="96" y="117" fill="#64748B" font-size="11" text-anchor="middle">from you</text>

  <path d="M152 102 L188 102" stroke="#6B84AD" stroke-width="1.6" marker-end="url(#lab)"/>

  <rect x="192" y="70" width="232" height="64" rx="11" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="308" y="97" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">ADR · Spec · Epic · Story</text>
  <text x="308" y="117" fill="#64748B" font-size="11" text-anchor="middle">the why, on disk</text>

  <path d="M428 102 L462 102" stroke="#6B84AD" stroke-width="1.6" marker-end="url(#lab)"/>

  <rect x="492" y="44" width="64" height="18" rx="9" fill="#E11D48" fill-opacity="0.10"/>
  <text x="524" y="57" fill="#E11D48" font-size="10" letter-spacing="1.5" text-anchor="middle">VERIFY</text>
  <rect x="466" y="70" width="152" height="64" rx="11" fill="#FFF1F2" stroke="#E11D48"/>
  <text x="542" y="97" fill="#BE123C" font-size="15" font-weight="600" text-anchor="middle">critic</text>
  <text x="542" y="117" fill="#B25B70" font-size="11" text-anchor="middle">fresh context, adversarial</text>

  <path d="M486 68 C 462 40, 442 40, 416 66" stroke="#E11D48" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#lar)"/>
  <text x="446" y="34" fill="#E11D48" font-size="11" text-anchor="middle">revise</text>

  <path d="M622 102 L656 102" stroke="#6B84AD" stroke-width="1.6" marker-end="url(#lab)"/>

  <rect x="660" y="70" width="150" height="64" rx="11" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="735" y="97" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Backlog</text>
  <text x="735" y="117" fill="#64748B" font-size="11" text-anchor="middle">kanban.md — ready</text>

  <!-- hand-off to the build lane (lane 2 sits 60px right: a gantt cascade,
       and the return arrow below gets a clear left margin) -->
  <path d="M735 138 C 735 192, 210 168, 164 234" stroke="#6B84AD" stroke-width="1.6" marker-end="url(#lab)"/>
  <text x="470" y="163" fill="#64748B" font-size="12" text-anchor="middle">an agent picks it up</text>

  <!-- ── lane 2: build ──────────────────────────────────────────── -->
  <rect x="104" y="240" width="116" height="64" rx="11" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="162" y="267" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Story</text>
  <text x="162" y="287" fill="#64748B" font-size="11" text-anchor="middle">in-progress</text>

  <path d="M224 272 L258 272" stroke="#6B84AD" stroke-width="1.6" marker-end="url(#lab)"/>

  <rect x="262" y="240" width="136" height="64" rx="11" fill="#F5F3FF" stroke="#7C3AED"/>
  <text x="330" y="267" fill="#6D28D9" font-size="15" font-weight="600" text-anchor="middle">planner</text>
  <text x="330" y="287" fill="#8B7BB5" font-size="11" text-anchor="middle">where in the code</text>

  <path d="M402 272 L436 272" stroke="#6B84AD" stroke-width="1.6" marker-end="url(#lab)"/>

  <rect x="440" y="240" width="140" height="64" rx="11" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="510" y="267" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Implement</text>
  <text x="510" y="287" fill="#64748B" font-size="11" text-anchor="middle">code + tests</text>

  <path d="M584 272 L618 272" stroke="#6B84AD" stroke-width="1.6" marker-end="url(#lab)"/>

  <rect x="668" y="214" width="64" height="18" rx="9" fill="#E11D48" fill-opacity="0.10"/>
  <text x="700" y="227" fill="#E11D48" font-size="10" letter-spacing="1.5" text-anchor="middle">VERIFY</text>
  <rect x="622" y="240" width="156" height="64" rx="11" fill="#FFF1F2" stroke="#E11D48"/>
  <text x="700" y="267" fill="#BE123C" font-size="15" font-weight="600" text-anchor="middle">reviewer</text>
  <text x="700" y="287" fill="#B25B70" font-size="11" text-anchor="middle">evidence per criterion</text>

  <path d="M638 238 C 616 212, 600 212, 576 236" stroke="#E11D48" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#lar)"/>
  <text x="606" y="206" fill="#E11D48" font-size="11" text-anchor="middle">fix</text>

  <path d="M782 272 L816 272" stroke="#059669" stroke-width="1.6" marker-end="url(#lag)"/>

  <rect x="820" y="240" width="126" height="64" rx="11" fill="#ECFDF5" stroke="#059669"/>
  <text x="883" y="267" fill="#047857" font-size="15" font-weight="600" text-anchor="middle">Done ✓</text>
  <text x="883" y="287" fill="#5F9E86" font-size="11" text-anchor="middle">criteria met</text>

  <!-- ── the feedback that closes the loop ──────────────────────── -->
  <path d="M883 308 C 883 344, 856 364, 776 370" stroke="#6B84AD" stroke-width="1.6" marker-end="url(#lab)"/>
  <rect x="250" y="352" width="520" height="36" rx="18" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="510" y="375" fill="#475569" font-size="12.5" text-anchor="middle">kanban · graph · code-map regenerate — the next session starts oriented</text>
  <path d="M246 370 C 90 370, 48 290, 76 142" stroke="#6B84AD" stroke-width="1.6" marker-end="url(#lab)"/>

  <text x="480" y="444" fill="#94A3B8" font-size="12.5" text-anchor="middle">gather context → act → verify — the agentic loop, run over the project itself, not just the code</text>
</svg>
