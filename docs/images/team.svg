<svg width="960" height="430" viewBox="0 0 960 430" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="tb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B7BB4"/>
    </marker>
  </defs>

  <rect width="960" height="430" rx="18" fill="#0C1322"/>
  <rect x="1" y="1" width="958" height="428" rx="17" stroke="#1E2A44"/>

  <!-- ── the people ─────────────────────────────────────────────── -->
  <g>
    <rect x="44" y="56" width="232" height="76" rx="12" fill="#101B31" stroke="#24344F"/>
    <circle cx="78" cy="94" r="15" fill="#1B2A45" stroke="#3D5378"/>
    <circle cx="78" cy="90" r="4.5" fill="#93A6C8"/>
    <path d="M71 103 a7 5.5 0 0 1 14 0" fill="#93A6C8"/>
    <text x="106" y="89" fill="#E2E8F0" font-size="15" font-weight="600">Dev A</text>
    <text x="106" y="109" fill="#7C8DB0" font-size="11.5">Claude Code + projectstore</text>
  </g>
  <g>
    <rect x="44" y="166" width="232" height="76" rx="12" fill="#101B31" stroke="#24344F"/>
    <circle cx="78" cy="204" r="15" fill="#1B2A45" stroke="#3D5378"/>
    <circle cx="78" cy="200" r="4.5" fill="#93A6C8"/>
    <path d="M71 213 a7 5.5 0 0 1 14 0" fill="#93A6C8"/>
    <text x="106" y="199" fill="#E2E8F0" font-size="15" font-weight="600">Dev B</text>
    <text x="106" y="219" fill="#7C8DB0" font-size="11.5">Claude Code + projectstore</text>
  </g>
  <g>
    <rect x="44" y="276" width="232" height="76" rx="12" fill="#101B31" stroke="#24344F"/>
    <circle cx="78" cy="314" r="15" fill="#1B2A45" stroke="#3D5378"/>
    <circle cx="78" cy="310" r="4.5" fill="#93A6C8"/>
    <path d="M71 323 a7 5.5 0 0 1 14 0" fill="#93A6C8"/>
    <text x="106" y="309" fill="#E2E8F0" font-size="15" font-weight="600">Dev C</text>
    <text x="106" y="329" fill="#7C8DB0" font-size="11.5">reviews on GitHub or Obsidian</text>
  </g>

  <!-- bind arrows -->
  <path d="M280 94 C 320 94, 330 106, 356 116" stroke="#5B7BB4" stroke-width="1.6" marker-end="url(#tb)"/>
  <path d="M280 204 L356 206" stroke="#5B7BB4" stroke-width="1.6" marker-end="url(#tb)"/>
  <path d="M280 314 C 320 314, 330 302, 356 294" stroke="#5B7BB4" stroke-width="1.6" marker-end="url(#tb)"/>
  <text x="308" y="196" fill="#7C8DB0" font-size="10.5" text-anchor="middle">bind</text>

  <!-- ── the vault ──────────────────────────────────────────────── -->
  <rect x="360" y="52" width="252" height="310" rx="14" fill="#0F2038" stroke="#3B82F6"/>
  <text x="486" y="86" fill="#93C5FD" font-size="16" font-weight="600" text-anchor="middle">The vault</text>
  <text x="486" y="106" fill="#7C8DB0" font-size="11" text-anchor="middle">its own git repo · plain markdown</text>
  <path d="M384 122 L588 122" stroke="#1E3355"/>
  <text x="384" y="150" fill="#A9B8D4" font-size="12.5">adr/ — decisions, with dates</text>
  <text x="384" y="177" fill="#A9B8D4" font-size="12.5">specs/ — the normative how</text>
  <text x="384" y="204" fill="#A9B8D4" font-size="12.5">epics/ · stories/ — the backlog</text>
  <text x="384" y="231" fill="#A9B8D4" font-size="12.5">kanban.md — the board</text>
  <text x="384" y="258" fill="#A9B8D4" font-size="12.5">graph.md — every link, typed</text>
  <text x="384" y="285" fill="#A9B8D4" font-size="12.5">code-map.md — epic ↔ code</text>
  <text x="384" y="330" fill="#64748B" font-size="11">every write previewed and</text>
  <text x="384" y="346" fill="#64748B" font-size="11">approved — by whoever binds</text>

  <!-- ── the remote ─────────────────────────────────────────────── -->
  <path d="M616 128 L696 128" stroke="#5B7BB4" stroke-width="1.6" marker-end="url(#tb)"/>
  <text x="656" y="118" fill="#7C8DB0" font-size="10.5" text-anchor="middle">push</text>
  <path d="M696 172 L616 172" stroke="#5B7BB4" stroke-width="1.6" marker-end="url(#tb)"/>
  <text x="656" y="192" fill="#7C8DB0" font-size="10.5" text-anchor="middle">review &amp; pull</text>

  <rect x="700" y="88" width="216" height="132" rx="12" fill="#131F36" stroke="#2C3E5F"/>
  <text x="808" y="118" fill="#E2E8F0" font-size="15" font-weight="600" text-anchor="middle">git remote</text>
  <text x="808" y="144" fill="#7C8DB0" font-size="11.5" text-anchor="middle">push / pull</text>
  <text x="808" y="164" fill="#7C8DB0" font-size="11.5" text-anchor="middle">ADRs &amp; specs reviewed</text>
  <text x="808" y="182" fill="#7C8DB0" font-size="11.5" text-anchor="middle">as merge requests</text>

  <text x="806" y="252" fill="#64748B" font-size="11.5" text-anchor="middle">the why gets reviewed,</text>
  <text x="806" y="269" fill="#64748B" font-size="11.5" text-anchor="middle">not just the code</text>

  <!-- ── the guarantees ─────────────────────────────────────────── -->
  <rect x="284" y="384" width="86" height="26" rx="13" fill="#101B31" stroke="#24344F"/>
  <text x="327" y="401" fill="#8FA1BF" font-size="11.5" text-anchor="middle">no server</text>
  <rect x="382" y="384" width="122" height="26" rx="13" fill="#101B31" stroke="#24344F"/>
  <text x="443" y="401" fill="#8FA1BF" font-size="11.5" text-anchor="middle">plain markdown</text>
  <rect x="516" y="384" width="160" height="26" rx="13" fill="#101B31" stroke="#24344F"/>
  <text x="596" y="401" fill="#8FA1BF" font-size="11.5" text-anchor="middle">any model can read it</text>
</svg>
