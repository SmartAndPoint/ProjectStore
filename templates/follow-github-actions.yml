# ProjectStore: move stories in the vault when their pull requests merge.
#
# Copy this file into your code repository, for example as
# .github/workflows/projectstore-follow.yml. ProjectStore never installs it,
# runs it or reads its token. After each push to the default branch (a merge
# is one) the job clones the vault's repository, binds this job to the clone,
# runs `projectstore follow --write`, commits and pushes what follow changed,
# and ends with follow's exit code: 0 with notes only, 1 on a finding.
# docs/follow-in-ci.md in the package explains every step.
#
# Settings, in this repository's Settings > Secrets and variables > Actions:
#   PROJECTSTORE_VAULT_TOKEN     secret, required: a token that can write to the vault repository and nothing else
#   PROJECTSTORE_VAULT_REMOTE    secret, required: the vault's https:// clone URL, with no user name or token in it;
#                                a secret, so GitHub masks it in the log, git's own errors included
#   PROJECTSTORE_VAULT_LANGUAGE  variable, required: the vault's template language, as bind --language takes it (en, de, ...)
#   PROJECTSTORE_VAULT_BRANCH    variable, optional: the vault branch to push; empty means the remote's default branch
#
# The two npx lines below name the ProjectStore release this file came with.
# To run another release, copy that release's file, or edit both lines.

name: ProjectStore follow

on:
  push:
    # Edit this line when your default branch has another name.
    branches:
      - main
  # Run it by hand to catch up after a fix, or when this file lands after merges.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# One run at a time, so two never push the vault together. A run replaced while
# it waits is covered by the next one: follow works the moves out again.
concurrency:
  group: projectstore-follow
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the vault settings, before any checkout
        env:
          VAULT_TOKEN: ${{ secrets.PROJECTSTORE_VAULT_TOKEN }}
          VAULT_REMOTE: ${{ secrets.PROJECTSTORE_VAULT_REMOTE }}
          VAULT_LANGUAGE: ${{ vars.PROJECTSTORE_VAULT_LANGUAGE }}
        run: |
          if [ -z "$VAULT_TOKEN" ]; then
            echo "::error::The secret PROJECTSTORE_VAULT_TOKEN is not set. Store a token that can write to the vault repository, and nothing else, under that name. A run from a fork or from Dependabot gets no secrets."
            exit 1
          fi
          case "$VAULT_REMOTE" in
            "")
              echo "::error::The secret PROJECTSTORE_VAULT_REMOTE is not set. Store the vault's https:// clone URL under that name."
              exit 1
              ;;
            https://*) ;;
            *)
              echo "::error::The secret PROJECTSTORE_VAULT_REMOTE must start with https://."
              exit 1
              ;;
          esac
          rest="${VAULT_REMOTE#https://}"
          case "${rest%%/*}" in
            *@*)
              echo "::error::The secret PROJECTSTORE_VAULT_REMOTE holds a user name or a token. Keep the token in the secret PROJECTSTORE_VAULT_TOKEN alone."
              exit 1
              ;;
          esac
          if [ -z "$VAULT_LANGUAGE" ]; then
            echo "::error::The repository variable PROJECTSTORE_VAULT_LANGUAGE is not set. Set it to the vault's template language, such as en, so that follow rewrites the board in that language."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # The token reaches git as a header on this one command: never in the URL,
      # never in the clone's .git/config, never in a step that runs npx.
      - name: Clone the vault
        env:
          VAULT_TOKEN: ${{ secrets.PROJECTSTORE_VAULT_TOKEN }}
          VAULT_REMOTE: ${{ secrets.PROJECTSTORE_VAULT_REMOTE }}
          VAULT_BRANCH: ${{ vars.PROJECTSTORE_VAULT_BRANCH }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          host="$(printf '%s' "$VAULT_REMOTE" | sed -E 's#^(https://[^/]+/).*$#\1#')"
          auth="$(printf 'x-access-token:%s' "$VAULT_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          git -c credential.helper= -c "http.$host.extraheader=AUTHORIZATION: basic $auth" clone --quiet --single-branch ${VAULT_BRANCH:+"--branch=$VAULT_BRANCH"} -- "$VAULT_REMOTE" "$RUNNER_TEMP/vault"

      # The binding lands in this job's checkout of the code, which the job
      # throws away; nothing here commits it.
      - name: Bind this job to the vault clone
        env:
          VAULT_LANGUAGE: ${{ vars.PROJECTSTORE_VAULT_LANGUAGE }}
        run: |
          npx --yes projectstore@0.30.20 bind --rebind --language="$VAULT_LANGUAGE" -- "$RUNNER_TEMP/vault"

      # --write is the consent. No --pr: a run replaced while it waited is
      # covered by this one. gh reads the pull requests with the run's own token.
      # follow's text names the vault's stories, so it is printed only when this
      # repository is private.
      - name: Follow the pull requests
        id: follow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          code=0
          npx --yes projectstore@0.30.20 follow --write > "$RUNNER_TEMP/follow.txt" 2>&1 || code=$?
          if [ "$REPO_PRIVATE" = "true" ]; then
            cat "$RUNNER_TEMP/follow.txt"
          else
            echo "follow exited with code $code. Its output is withheld: this repository is not known to be private, and the output names the vault's stories."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Commit and push what follow changed, never forced
        env:
          VAULT_TOKEN: ${{ secrets.PROJECTSTORE_VAULT_TOKEN }}
          VAULT_REMOTE: ${{ secrets.PROJECTSTORE_VAULT_REMOTE }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          cd "$RUNNER_TEMP/vault"
          # The stories and epics, and the views follow regenerates; nothing else.
          for path in epics kanban.md graph.md code-map.md flow.md spec-tree.md; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          git ls-files -m -o --exclude-standard -- ':(glob)*/README.md' | while IFS= read -r index; do
            git add -- "$index"
          done
          if git diff --cached --quiet; then
            echo "Nothing to push: the vault already says what the pull requests say."
            exit 0
          fi
          git commit --quiet -m "follow: update the vault after a merge"
          host="$(printf '%s' "$VAULT_REMOTE" | sed -E 's#^(https://[^/]+/).*$#\1#')"
          auth="$(printf 'x-access-token:%s' "$VAULT_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          if ! git -c credential.helper= -c "http.$host.extraheader=AUTHORIZATION: basic $auth" push --quiet origin HEAD; then
            echo "::error::The vault refused the push: it moved while follow ran, or the token cannot write to that branch. Nothing was forced. Re-run this job: follow works out the same moves again."
            exit 1
          fi

      - name: End with follow's exit code
        env:
          FOLLOW_CODE: ${{ steps.follow.outputs.code }}
        run: exit "$FOLLOW_CODE"
