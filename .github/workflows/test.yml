name: test

# The release workflow runs the guards, but only when a tag is pushed — which
# means a merge that breaks the packlist or desynchronises a manifest version
# stays green until someone cuts a release, and then fails the release instead
# of the merge. This runs the same suite where the mistake is still cheap.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # package.json promises node >=20, so the suite runs on every line that
    # promise covers: 20 (the floor), 22 and 24. The site check does not
    # depend on Node and runs once.
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Manifest versions agree
        run: node scripts/version-guard.mjs

      # The public site's pages are generated from the templates in site/src/ and
      # site/locales/*.json by site/tools/i18n.py and committed. Rebuilding
      # them here must change nothing: a page edited by hand, a template edit
      # never built, or an English change never extracted fails the merge.
      # Python is pinned because html.parser's output has changed between
      # versions; the committed pages are 3.12's (site/README.md).
      - uses: actions/setup-python@v7
        if: matrix.node == '24'
        with:
          python-version: "3.12"

      - name: The site's committed pages are the build's
        if: matrix.node == '24'
        run: |
          python3 site/tools/i18n.py check
          python3 site/tools/i18n.py extract
          python3 site/tools/i18n.py build --strict
          git diff --exit-code -- site/
          if git status --porcelain -- site/ | grep .; then echo "::error::the build left files not in the commit"; exit 1; fi

      - name: Test suite, including the packaging contracts
        run: node --test --import ./tests/fixtures/hermetic.mjs tests/*.test.mjs

  # ESLint and Prettier (the lint ADR): pinned in tools/lint/, a package of
  # their own with its own committed lockfile, so the plugin root carries none
  # for Claude Code to install from. The test job above installs nothing; this
  # one runs once, on Node 24, since ESLint 10 needs ^20.19, ^22.13 or >=24.
  lint:
    runs-on: ubuntu-latest
    name: lint (node 24)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install the lint tools (npm ci in tools/lint)
        run: npm run lint:setup

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check
