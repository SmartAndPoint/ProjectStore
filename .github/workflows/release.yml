name: release

# Publishes to npm over OIDC — no long-lived token exists in this repository's
# secrets, and none should ever be added. The trusted publisher is configured
# on each package's own settings page (npmjs.com → <package> → Settings →
# Trusted publisher), which is why the FIRST publish of a name is manual: the
# form requires the package to already exist. The shells' names exist as
# 0.0.1 placeholders, so their forms accept this workflow before their first
# real release.

# Tags only, deliberately. A `workflow_dispatch` run has no tag, so
# GITHUB_REF_NAME would be a branch name and the version guard would reject it
# every time — a manual trigger here could only ever fail, or publish
# unchecked. Releases are cut by pushing a tag.

# One package, N tarballs (the shells ADR): the core publishes first, then a
# matrix over the shells `packaging/shells.mjs --list --json` names — the
# non-private ones, so a shell whose plugin root is not rendered yet cannot
# reach the registry by construction. Every publish step skips a
# name@version the registry already has, so a partial release is recovered by
# re-running the same tag, never by hand.

# Then the GitHub Release, from the notes the release PR committed
# (PS-HARNESS: "A release tag shows on every surface…"). Releases written by
# hand drifted three times — the last time seven tags, v0.29.3 to v0.30.4, went
# out with none, and the repository page and the README's badge said v0.29.2
# while npm served 0.30.4. What a user then sees on every surface is checked by
# surfaces.yml, a workflow of its own, so this run's colour means "published,
# and the directory branch moved".

# And, for a stable release, the `directory` branch Anthropic's directory
# tracks: the core's packed tree as its next commit (PS-DIRECTORY: "The
# maintainer submits ProjectStore through the developer portal…").
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing

jobs:
  core:
    runs-on: ubuntu-latest
    outputs:
      shells: ${{ steps.shells.outputs.shells }}
      version: ${{ steps.version.outputs.version }}
      disttag: ${{ steps.version.outputs.disttag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm >= 11.5.1 and Node >= 22.14.0. The runner
      # image ships an older npm, so pin an exact version rather than tracking
      # @latest: a moving npm inside the release path is the same class of
      # supply-chain surface this workflow exists to avoid.
      - run: npm install -g npm@11.11.0
      - run: npm --version

      - name: One version across every manifest, every shell and the tag
        run: node scripts/version-guard.mjs --tag "${GITHUB_REF_NAME}"

      - name: The shells' committed package.json and bin equal their render
        run: node packaging/shells.mjs --check

      - name: Tests, including the packaging contracts
        run: node --test --import ./tests/fixtures/hermetic.mjs tests/*.test.mjs

      # A prerelease must not become `latest`, or a bare `npx <shell>` serves a
      # release candidate to everyone who did not ask for one. npm
      # defaults to `latest` when --tag is omitted, so the tag is computed here
      # and passed to every publish: anything with a "-" in its version (semver's
      # prerelease marker) goes to `next`.
      - id: version
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$V" != "${V%%-*}" ]; then echo "disttag=next" >> "$GITHUB_OUTPUT"; else echo "disttag=latest" >> "$GITHUB_OUTPUT"; fi
          echo "publishing $V to the \"$([ "$V" != "${V%%-*}" ] && echo next || echo latest)\" dist-tag"

      - id: shells
        name: The publishable shells (a private shell never reaches the matrix)
        run: echo "shells=$(node packaging/shells.mjs --list --json)" >> "$GITHUB_OUTPUT"

      # --provenance is requested here rather than in package.json. npm's docs
      # say Trusted Publishing attaches provenance on its own; a January 2026
      # field report says the flag was still needed. Asking explicitly costs
      # nothing, and keeping it out of package.json is what lets a manual
      # publish work at all — publishConfig.provenance fails outside CI.
      #
      # `npm view <name>@<version> version` prints the version when it is
      # published, nothing when the name exists at other versions, and exits 1
      # when the name does not exist at all; `-n "$(…)"` reads all three.
      - name: Publish the core, unless this version is on the registry already
        run: |
          if [ -n "$(npm view "projectstore@${GITHUB_REF_NAME#v}" version 2>/dev/null)" ]; then
            echo "projectstore@${GITHUB_REF_NAME#v} is published already — skipping (a re-run of the tag recovers a partial release)"
          else
            npm publish --provenance --tag "${{ steps.version.outputs.disttag }}"
          fi

  shells:
    needs: core
    if: needs.core.outputs.shells != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: ${{ fromJSON(needs.core.outputs.shells) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@11.11.0

      # From the core's OWN pack tarball, never from the registry: the copy
      # published seconds ago may not have propagated, and the pair the
      # release verified is the pair that ships.
      - name: Build the shell from the core's pack tarball
        run: node packaging/shells.mjs --build --only "${SHELL_NAME}" --out dist
        env:
          SHELL_NAME: ${{ matrix.shell }}

      # The tarball form keeps "the file that ships is the file the fixture was
      # compared with". The leading "./" is load-bearing: measured 2026-09-07,
      # npm reads a bare relative path as a git spec and tries
      # `git ls-remote ssh://git@github.com/dist/<file>.tgz.git`, which is how
      # v0.28.0-rc.1's shell publish died. Same family as npx reading a bare
      # tarball path as a command. Should npm refuse provenance for a tarball
      # spec (its docs describe the directory form only), the built directory is
      # beside it:
      #   cd dist/build/<shell> && npm publish --provenance --tag "$DIST_TAG"
      - name: Publish the shell, unless this version is on the registry already
        env:
          SHELL_NAME: ${{ matrix.shell }}
          VERSION: ${{ needs.core.outputs.version }}
          DIST_TAG: ${{ needs.core.outputs.disttag }}
        run: |
          if [ -n "$(npm view "${SHELL_NAME}@${VERSION}" version 2>/dev/null)" ]; then
            echo "${SHELL_NAME}@${VERSION} is published already — skipping"
          else
            npm publish "./dist/${SHELL_NAME}-${VERSION}.tgz" --provenance --tag "${DIST_TAG}"
          fi

  # The GitHub Release, after every publish and never before: a release that
  # announces a version npm refused would be the drift this job exists to end.
  # The `if` runs it when the shells' matrix was skipped (an empty publishable
  # list) as well as when it passed; a bare `needs` would skip it then.
  #
  # The notes are packaging/release-notes/<tag>.md — "# <tag> — <title>", then
  # the body — held to that shape by the version guard in the core job, so a
  # tag without its notes stops before anything publishes.
  #
  # "Latest" is explicit on every create: GitHub makes each new release Latest
  # by default, and a prerelease must never be. A release that exists already
  # is left as it is, so re-running the tag recovers this job too. Reading it
  # answers 200 (skip), 404 (create) or anything else, which fails the job
  # rather than racing a create into a 422.
  github-release:
    needs: [core, shells]
    if: ${{ !cancelled() && needs.core.result == 'success' && (needs.shells.result == 'success' || needs.shells.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create: one of the two contents: write in this workflow, with the directory job's
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: The GitHub Release, from the committed notes, unless it exists already
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ needs.core.outputs.disttag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="packaging/release-notes/${TAG}.md"
          STATUS="$(gh api -i "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null | head -n 1 | cut -d' ' -f2 || true)"
          case "$STATUS" in
            200) echo "${TAG} has a GitHub Release already — skipping"; exit 0 ;;
            404) ;;
            *) echo "::error::reading the GitHub Release for ${TAG} answered ${STATUS:-nothing}"; exit 1 ;;
          esac
          # The guard reads a CRLF file too; the release gets no carriage returns.
          TITLE="$(sed -n '1s/^# //p' "$NOTES" | tr -d '\r')"
          tail -n +2 "$NOTES" | tr -d '\r' | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          case "$DIST_TAG" in
            latest) gh release create "$TAG" --verify-tag --latest --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" ;;
            next) gh release create "$TAG" --verify-tag --prerelease --latest=false --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" ;;
            *) echo "::error::no dist-tag from the core job (\"${DIST_TAG}\"); a release would be guessed"; exit 1 ;;
          esac

  # The directory branch, after the core publish, for a stable release only:
  # a release candidate never reaches the directory's users. Its tree is the
  # core's npm packlist, packed from this checkout as the core job packed it
  # and held to tests/fixtures/packlist.json; packaging/directory-branch.mjs
  # commits it as the next commit on `directory` (an orphan when the branch is
  # missing) and pushes. A tree equal to the branch's head commits nothing, so
  # re-running the tag recovers this job too, and an older tag never moves the
  # branch back. The token reaches git in the remote URL inside the script;
  # the checkout keeps persist-credentials: false. The tree carries no
  # .github/, so the push starts no workflow.
  #
  # .claude-plugin/marketplace.json stays in the tree (no --strip) until the
  # first Validate in the developer portal answers the story's open question.
  directory:
    needs: core
    if: ${{ needs.core.result == 'success' && needs.core.outputs.disttag == 'latest' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # git push to the directory branch: one of the two contents: write in this workflow, with github-release's
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install -g npm@11.11.0

      - name: The packed tree, as the next commit on the directory branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.core.outputs.version }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: node packaging/directory-branch.mjs --version "${VERSION}"
